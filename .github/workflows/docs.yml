name: Deploy documentation

on:
  push:
    branches: [main]
    # site/ and the three things outside it the build reads: VERSION and
    # CHANGELOG.md, for the release every page's JSON-LD and the changelog
    # page state (src/lib/changelog.mjs), and the compose files the Docker
    # install page shows (src/components/ComposePicker.astro). A release that
    # touches nothing else still has to redeploy, or the site keeps
    # announcing the previous one.
    paths:
      - ".github/workflows/docs.yml"
      - "site/**"
      - "VERSION"
      - "CHANGELOG.md"
      - "deploy/*.yaml"
  workflow_dispatch:
    inputs:
      indexnow_all:
        description: >-
          Tell IndexNow about every page in the sitemap, not only the ones
          this deploy changed. Once, for a site IndexNow has not been told
          about and only if a deploy's own submission failed; see the
          "List the pages this deploy changes" step.
        type: boolean
        default: false

concurrency:
  group: pages
  cancel-in-progress: false

# Workflow-wide: a read token and nothing else. The build job runs third-party
# code (pnpm install, a headless Chromium fetched outside any lockfile), so the
# Pages credential and the OIDC identity that mints it live on `deploy`, which
# runs one pinned action and no code of its own.
permissions:
  contents: read

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    # The build, the gates that read it and pa11y's browser run are minutes
    # between them. A hung browser must not hold a runner for the six-hour
    # default.
    timeout-minutes: 20
    # The pages the indexnow job submits once this build is deployed: a JSON
    # array of URLs, written by the "List the pages this deploy changes" step.
    outputs:
      indexnow_urls: ${{ steps.changed.outputs.urls }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Starlight's `lastUpdated` and the sitemap's per-page `<lastmod>`
          # both read git history per file. A shallow checkout has only the
          # latest commit, so every page would carry the same date.
          fetch-depth: 0

      # pnpm/action-setup installs pnpm itself from the npm registry on every
      # run. The installed pnpm is cached, keyed on the exact packageManager
      # string in site/package.json, and on a hit the action is skipped and
      # its bin directory put on PATH. Same arrangement as ci.yml's two site
      # jobs, so all three and a developer's machine run the same pnpm.
      - name: Read the pinned pnpm version
        id: pnpm
        run: echo "spec=$(jq -r .packageManager site/package.json)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm
        id: pnpm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/setup-pnpm
          key: pnpm-${{ runner.os }}-${{ steps.pnpm.outputs.spec }}

      - name: Set up pnpm
        if: steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          package_json_file: site/package.json

      - name: Put the cached pnpm on PATH
        if: steps.pnpm-cache.outputs.cache-hit == 'true'
        run: echo "$HOME/setup-pnpm/node_modules/.bin" >> "$GITHUB_PATH"

      # site/.node-version, like the ci.yml site jobs, so the Node that builds
      # the site is the one that linted it.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: site/.node-version
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile

      # rehype-mermaid renders every mermaid block to inline SVG at build time
      # with a headless Chromium, so the browser must be present before the
      # build. It is a download outside any lockfile, so it is cached keyed on
      # the lockfile: the Playwright version the lockfile pins is what decides
      # which browser build is fetched. `--with-deps` installs system libraries
      # with apt on every run regardless, which is cheap and not cacheable.
      - name: Cache the Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('site/pnpm-lock.yaml') }}

      - name: Install the browser mermaid renders with
        working-directory: site
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Check
        working-directory: site
        run: |
          pnpm run contrast:check
          pnpm run i18n:check
          pnpm run cards:check
          pnpm run stats:check
          pnpm run figures:check
          pnpm run docs:check
          pnpm check
          pnpm run eslint
          pnpm run format:check

      - name: Build
        working-directory: site
        run: pnpm build

      - name: Validate the built HTML
        working-directory: site
        run: |
          pnpm run html-validate
          pnpm run htmlhint

      # directives:check is here because an Astro directive that leaks into the
      # output as a literal attribute passes every HTML validator above: it is
      # well-formed HTML that renders wrong.
      - name: Check what the build says to machines
        working-directory: site
        run: |
          pnpm run a11y:check
          pnpm run schema:check
          pnpm run directives:check
          pnpm run twins:check
          pnpm run llms:check

      # pa11y drives a real browser. The `pa11y` script points it at the
      # Chromium installed above for mermaid, so pages are audited in the
      # browser that rendered their diagrams. puppeteer's install script still
      # downloads a Chrome of its own, which nothing here launches. The script
      # starts the preview on a free port and audits the URL the preview
      # announces, so a server already holding 4321 cannot be audited by
      # mistake (scripts/run-pa11y.mjs says how that happened).
      - name: Accessibility (pa11y)
        working-directory: site
        run: pnpm run pa11y

      # Also a real browser, and for the same reason: no validator reads a
      # layout. Every table on this site once overflowed its column at phone
      # width with every other check on this page green
      # (scripts/check-table-fit.mjs says by how much).
      - name: Tables fit their column on a phone
        working-directory: site
        run: pnpm run tables:check

      # Which pages this deploy adds, changes or removes, for the indexnow job.
      # IndexNow is for changed URLs: its FAQ (indexnow.org/faq) says it "is
      # not designed for submitting every URL on your site at once", and the
      # sitemap already lists every page. So each page in the built sitemap is
      # compared with the one Pages serves now, before this build replaces it:
      # its markdown twin byte for byte, which is the page's text with every
      # figure and the version rendered, and its <title> and description tags,
      # because the <title> a result shows is not the heading the twin opens
      # with. The HTML as a whole is not compared: the CSP in every page moves
      # whenever Starlight changes a script, which no search engine needs to
      # hear about. Twins are stable between builds: on 2026-09-24 two builds
      # of one tree wrote all 84 twins byte for byte alike. The branch that
      # added this step rewrote the opening of every page, and its build
      # differed from the live site on every page that day, so its deploy
      # submits every URL by itself; the manual indexnow_all run is needed
      # only if that deploy's indexnow job did not get a 200 or 202. For a
      # page the build has, a fetch that fails counts as a change, so an error
      # can add its URL but never lose it, and so does every page still
      # unread after BUDGET seconds, so a slow or unreachable live site costs
      # at most that long. A removed page can only be found in a live sitemap
      # that was read, so a sitemap that could not be is a warning. Never
      # fatal: the step's own timeout is a step failure, which
      # continue-on-error absorbs, so it cannot run the job into its 20
      # minutes and hold the deploy back; at worst nothing is submitted, and
      # the indexnow job says so. Only in this repository, like that job.
      - name: List the pages this deploy changes
        id: changed
        if: github.repository == 'jmrplens/ghchronicle'
        continue-on-error: true
        timeout-minutes: 4
        working-directory: site
        env:
          BASE: https://jmrplens.github.io/ghchronicle/
          ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.indexnow_all }}
          BUDGET: 120
        run: |
          set -u
          # Every pipeline that may fail ends in `|| true`, so the script reads
          # the same under the runner's `bash -e` and under pipefail.
          locs() { grep -oE '<loc>[^<]+</loc>' | sed -E 's#</?loc>##g' | grep -F "$BASE" || true; }
          shown() { grep -oE '<title>[^<]*</title>|<meta name="description" content="[^"]*"' || true; }
          built=$(cat dist/sitemap-[0-9]*.xml | locs || true)
          if [ -z "$built" ]; then
            echo "::warning title=IndexNow::the built sitemap lists no pages, so nothing will be submitted"
            exit 0
          fi
          changed=""
          if [ "$ALL" = "true" ]; then
            changed="$built"
          else
            fetch() { curl -fsS --connect-timeout 5 --max-time 10 "$@"; }
            while IFS= read -r url; do
              rel="${url#"$BASE"}"
              if [ "$SECONDS" -lt "$BUDGET" ] &&
                fetch -o live.md "${url}index.md" &&
                cmp -s live.md "dist/${rel}index.md" &&
                [ "$(fetch "$url" | shown || true)" = "$(shown < "dist/${rel}index.html" || true)" ]; then
                continue
              fi
              changed+="$url"$'\n'
            done <<< "$built"
            if [ "$SECONDS" -ge "$BUDGET" ]; then
              echo "::warning title=IndexNow::the live site was slow to answer; pages not compared within ${BUDGET} s count as changed"
            fi
            rm -f live.md
            # A page this build no longer has is a change too: IndexNow takes
            # removed URLs, and the engine then finds the 404 itself. A removed
            # page shows only in a live sitemap that was read, so here a failed
            # fetch would lose URLs rather than add them, and it warns instead.
            lost=""
            sitemaps=$(fetch "${BASE}sitemap-index.xml" | grep -oE '<loc>[^<]+</loc>' | sed -E 's#</?loc>##g' || true)
            [ -n "$sitemaps" ] || lost=1
            live=""
            while IFS= read -r sitemap; do
              if [ -n "$sitemap" ]; then
                if page=$(fetch "$sitemap"); then live+="$(locs <<< "$page")"$'\n'; else lost=1; fi
              fi
            done <<< "$sitemaps"
            if [ -n "$lost" ]; then
              echo "::warning title=IndexNow::the live sitemap could not be read in full, so pages this deploy removes may not be listed"
            fi
            changed+="$(comm -13 <(sort -u <<< "$built") <({ grep . <<< "$live" || true; } | sort -u))"
          fi
          urls=$({ grep . <<< "$changed" || true; } | sort -u | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "urls=$urls" >> "$GITHUB_OUTPUT"
          echo "$(jq length <<< "$urls") of $(grep -c . <<< "$built") pages to submit to IndexNow after the deploy:"
          jq -r '.[]' <<< "$urls"

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish the uploaded artifact
      id-token: write # actions/deploy-pages authenticates to Pages with OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

  # Tells the search engines that take IndexNow which pages this deploy
  # changed, instead of waiting for them to recrawl the sitemap. One POST to
  # the global endpoint is shared with every participant; indexnow.org/faq
  # lists them (Amazon, Bing, Naver, Seznam.cz, Yandex and Yep, read
  # 2026-09-24). Best effort: the job never fails the run, and a refusal is a
  # warning in its log.
  #
  # The key is not a secret. IndexNow proves that the submitter controls the
  # host by fetching the key from it, so it is public by design:
  # https://jmrplens.github.io/dc7e97bcf6a14edea77efc1983e3e751.txt, served by
  # the jmrplens.github.io repository and answering 200 with the key on
  # 2026-09-24. A key file at the root of the host covers every URL on it,
  # /ghchronicle/ included (indexnow.org/documentation, "Option 2"), which is
  # why the URLs submitted are the Pages ones and not the jmrp.io/docs
  # addresses that redirect to them. It runs no code from this repository and
  # needs no token, hence `permissions: {}`.
  #
  # Only in this repository: a fork with Pages switched on would otherwise
  # submit this host's URLs under this host's key, listed by how the fork's
  # build differs from this site, and spend the key's quota on them.
  indexnow:
    name: Tell IndexNow
    needs: [build, deploy]
    if: github.repository == 'jmrplens/ghchronicle'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions: {}
    steps:
      - name: Submit the pages this deploy changed
        env:
          URLS: ${{ needs.build.outputs.indexnow_urls }}
          HOST: jmrplens.github.io
          KEY: dc7e97bcf6a14edea77efc1983e3e751
        run: |
          set -u
          # A listing that ran to its end writes a JSON array, `[]` included,
          # so an empty or unreadable one means it never finished: it failed,
          # timed out or found no built sitemap. That is not "nothing changed".
          if [ -z "$URLS" ] || ! count=$(jq -e 'length' <<< "$URLS" 2>/dev/null); then
            echo "::warning title=IndexNow::the build did not list the pages this deploy changed, so nothing was submitted; see the build job's \"List the pages this deploy changes\" step, and if pages did change, run the workflow with indexnow_all"
            exit 0
          fi
          if [ "$count" = 0 ]; then
            echo "No page was added, changed or removed by this deploy; nothing to submit."
            exit 0
          fi
          body=$(jq -nc --arg host "$HOST" --arg key "$KEY" --argjson urls "$URLS" \
            '{host: $host, key: $key, keyLocation: "https://\($host)/\($key).txt", urlList: $urls}')
          code=$(curl -sS -o response.txt -w '%{http_code}' --max-time 30 \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "$body" https://api.indexnow.org/indexnow) || code=000
          # 200 is submitted, 202 is received with the key still being checked;
          # anything else (400, 403, 422, 429) is in indexnow.org/documentation.
          case "$code" in
            200 | 202) echo "IndexNow took $count URL(s): HTTP $code" ;;
            *)
              echo "::warning title=IndexNow::HTTP $code for $count URL(s); the deploy stands and the pages wait for the next crawl"
              if [ -s response.txt ]; then cat response.txt; echo; fi
              ;;
          esac
