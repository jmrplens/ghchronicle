name: Release

on:
  push:
    tags:
      # Three parts, so the moving major tag does not start a release. The
      # Action resolves `uses: jmrplens/ghchronicle@vN` through a `vN` that is
      # force-moved onto each patch release, and under a bare `v*` that push
      # started this workflow, whose first job compares the tag against the
      # VERSION file: `2` is not `2.0.0`, so every move of the major tag left
      # a failed release run behind it.
      - "v*.*.*"

# Everything this workflow is trusted with, and nothing else. id-token is what
# makes the cosign signatures keyless: the identity is this workflow, recorded
# in a public transparency log, so there is no private key to keep anywhere.
permissions:
  contents: write # create the GitHub release and upload its assets
  packages: write # push to ghcr.io with the automatic token
  id-token: write # keyless signing

# Two tags pushed close together would race on the same release and on the
# `latest` tag of both registries, which the GoReleaser job moves last.
# cancel-in-progress stays false: a release killed between the image push and
# the GitHub release leaves images published that nothing announces.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  # Pinned exactly rather than by range. goreleaser-action downloads GoReleaser,
  # and the step below downloads syft, into the job that holds the signing
  # identity, so pinning the action and letting the tool float leaves the code
  # that actually runs unpinned.
  GORELEASER_VERSION: "v2.18.1"
  SYFT_VERSION: "v1.51.1"

jobs:
  # The one check that runs before a runner is spent on anything else. Three
  # things read a release number and only two of them read the same one: the
  # binaries and the image tags come from the git tag, while an image built
  # from a clone, and any unstamped build, reports the VERSION file the root
  # package embeds. If the two disagree the release ships a binary that lies
  # about itself, so fail here instead. The release notes are read here too,
  # for the same reason: a tag with nothing to say is refused before anything
  # is built rather than after it is published.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Hold the tag and the VERSION file to each other
        id: version
        run: |
          set -euo pipefail
          FILE_V="$(tr -d '[:space:]' < VERSION)"
          TAG_V="${GITHUB_REF_NAME#v}"
          if [ "${FILE_V}" != "${TAG_V}" ]; then
            echo "::error::VERSION says ${FILE_V} but the tag is v${TAG_V}: the release binaries would report ${TAG_V} while a build from this tree reports ${FILE_V}. Update VERSION, or tag v${FILE_V}."
            exit 1
          fi
          # Go refuses a v2 or later tag whose go.mod path does not end in
          # its major, and `go install ...@latest` then settles in silence on
          # the newest tag it can accept. Five releases went out that way,
          # each one installing 1.0.0.
          MAJOR="${TAG_V%%.*}"
          MOD_PATH="$(awk '$1 == "module" {print $2; exit}' go.mod)"
          WANT="github.com/jmrplens/ghchronicle"
          if [ "${MAJOR}" -ge 2 ]; then WANT="${WANT}/v${MAJOR}"; fi
          if [ "${MOD_PATH}" != "${WANT}" ]; then
            echo "::error::go.mod says module ${MOD_PATH} but a v${MAJOR} tag needs ${WANT}: go install would never reach this release. Change the module path, every import and every documented go install command."
            exit 1
          fi
          echo "version=${TAG_V}" >> "$GITHUB_OUTPUT"
          echo "releasing ${TAG_V}, VERSION, tag and module path agree"

      # The release page carries CHANGELOG.md's section for the version, the
      # part written for people, and not a list of commits. The GoReleaser job
      # receives it through this job's output, so what it publishes is exactly
      # the text checked here.
      - name: Take the release notes from CHANGELOG.md
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/release-notes.md"
          # From the "## X.Y.Z - YYYY-MM-DD" heading to the next "## " heading
          # outside a code fence. The heading itself stays behind, since the
          # release is already titled vX.Y.Z and GitHub dates it, and so do the
          # blank lines at either end.
          awk -v v="${VERSION}" '
            /^[[:space:]]*(```|~~~)/ { fence = !fence }
            !fence && /^## / {
              if (on) exit
              if (index($0, "## " v " - ") == 1 && $0 ~ / - [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]$/) { on = 1; next }
            }
            on { line[++n] = $0 }
            END {
              first = 1
              while (first <= n && line[first] ~ /^[[:space:]]*$/) first++
              last = n
              while (last >= first && line[last] ~ /^[[:space:]]*$/) last--
              for (i = first; i <= last; i++) print line[i]
            }
          ' CHANGELOG.md > "${notes}"
          if [ ! -s "${notes}" ]; then
            echo "::error::CHANGELOG.md has no section under '## ${VERSION} - YYYY-MM-DD', or an empty one, and that section is the release notes. Write it, or tag the version it was written for."
            exit 1
          fi
          # A relative link on the release page resolves against
          # /releases/tag/, where nothing in this repository lives. Markdown
          # has three ways to write one: inline, a reference definition, and
          # an HTML href or src, and all three are looked at. A footnote
          # definition, [^1]:, is not a link. A bare #fragment stays refused:
          # it points into CHANGELOG.md, not into the release page.
          link='\]\(<?[^)>[:space:]]+'
          definition='^[[:space:]]{0,3}\[[^]^][^]]*\]:[[:space:]]*<?[^>[:space:]]+'
          attribute="(href|src)=(\"[^\"]*|'[^']*)"
          absolute="(\]\(<?|\]:[[:space:]]*<?|(href|src)=[\"'])(https?://|mailto:)"
          if grep -noE "${link}|${definition}|${attribute}" "${notes}" | grep -vE "${absolute}"; then
            echo "::error::the ${VERSION} section of CHANGELOG.md has the relative links listed above, which the release page would resolve against /releases/tag/. Make them absolute."
            exit 1
          fi
          # A random delimiter, so no line of the section can end the value early.
          delim="NOTES_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          { echo "notes<<${delim}"; cat "${notes}"; echo "${delim}"; } >> "$GITHUB_OUTPUT"
          echo "release notes: $(wc -l < "${notes}") lines from the ${VERSION} section of CHANGELOG.md"

  # The same workflow a maintainer runs by hand, called rather than copied, so
  # there is one harness and a fix to it cannot land in one copy and not the
  # other. It runs the collector against the real stores, which no job in
  # ci.yml does.
  e2e:
    name: E2E gate
    needs: [preflight]
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read

  # Beside the E2E gate rather than behind it: neither consumes anything the
  # other produces, so running them in series would add the longer one's whole
  # runtime to every release. It gates because a data race is exactly the
  # defect that reaches a tag otherwise: nothing in ci.yml runs the detector,
  # so a release is the one moment the question is guaranteed to be asked.
  race:
    name: Race gate
    needs: [preflight]
    uses: ./.github/workflows/race.yml
    permissions:
      contents: read

  # Both gates sit in front of this job because it is the first one that
  # publishes anything, and what it publishes cannot be taken back once
  # somebody has pulled it.
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [preflight, e2e, race]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The compare link in the release notes runs from the previous tag,
          # which GoReleaser finds by walking the history a shallow clone
          # does not contain.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          # setup-go caches ~/go/pkg/mod and the build cache by default, and a
          # tag run restores what a run on main wrote. This job signs what it
          # compiles, so its inputs must all be fixed by the repository: the
          # modules are downloaded fresh and checked against go.sum instead of
          # coming from an Actions cache no signature covers.
          cache: false

      # GoReleaser shells out to both of these by name, so they have to be on
      # PATH before it runs: syft writes the SBOM for every archive, cosign
      # signs the checksum file and the SBOMs. Cosign comes first because the
      # syft install below uses it to verify what it downloaded.
      #
      # cosign-release is pinned because the cosign major decides how a
      # signature is written and therefore who can verify it afterwards, and
      # letting the installer's default float would let a release change that
      # without a commit here.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.3"

      # Fetched by hand rather than through anchore/sbom-action/download-syft.
      # That action is SHA-pinned, but on Linux it downloads
      # raw.githubusercontent.com/anchore/syft/main/install.sh and runs it with
      # sh, so the code executing in this job came from a branch head. This job
      # holds the identity the keyless signatures are minted for, which is
      # exactly where nothing may be resolved at run time. The bytes are pinned
      # by SHA256 here; cosign additionally proves they came from anchore's
      # release workflow. Its certificate identity ends in refs/heads/main
      # because syft releases from main rather than from the tag, and the
      # certificate asset is base64-wrapped.
      - name: Install Syft
        env:
          SYFT_SHA256: "8fcb33017a0dc1058298c923c436d19dfa68ae93968e0b423248542e3afb9fc3"
        run: |
          set -euo pipefail
          TARBALL="syft_${SYFT_VERSION#v}_linux_amd64.tar.gz"
          BASE="https://github.com/anchore/syft/releases/download/${SYFT_VERSION}"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 --retry-connrefused -o "${TARBALL}" "${BASE}/${TARBALL}"
          echo "${SYFT_SHA256}  ${TARBALL}" | sha256sum -c -
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 --retry-connrefused -o checksums.txt "${BASE}/syft_${SYFT_VERSION#v}_checksums.txt"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 --retry-connrefused -o checksums.pem "${BASE}/syft_${SYFT_VERSION#v}_checksums.txt.pem"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 --retry-connrefused -o checksums.sig "${BASE}/syft_${SYFT_VERSION#v}_checksums.txt.sig"
          base64 -d checksums.pem > checksums.decoded.pem
          cosign verify-blob \
            --certificate checksums.decoded.pem \
            --signature checksums.sig \
            --certificate-identity "https://github.com/anchore/syft/.github/workflows/release.yaml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            checksums.txt
          grep " ${TARBALL}\$" checksums.txt | sha256sum -c -
          tar xzf "${TARBALL}" syft
          install -m 0755 syft /usr/local/bin/syft
          rm -f "${TARBALL}" checksums.txt checksums.pem checksums.decoded.pem checksums.sig syft
          syft --version

      # QEMU emulates the architecture the runner is not, which is what lets
      # one x86 runner build the arm64 image and, at the end of this job, run
      # it. Buildx replaces the default docker driver with a container one:
      # only that driver builds a multi-platform image in a single push, and
      # only a single push accepts the index annotations that give the GHCR
      # package page its description.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a  # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is the one publish target whose credentials this repository
      # may simply not have. Degrade instead of failing: the binaries, the
      # signatures and the ghcr.io image are worth shipping on their own, and a
      # release that dies after uploading half of them is worse than one that
      # ships without a second copy of the image.
      - name: Decide whether Docker Hub is part of this release
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN not set, skipping the Docker Hub image. Everything else is released."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Under the runner's temporary directory and not the checkout, because
      # GoReleaser refuses to release from a dirty tree and an untracked file
      # is enough to make it dirty.
      - name: Write the release notes the preflight took
        env:
          NOTES: ${{ needs.preflight.outputs.notes }}
        run: printf '%s\n' "${NOTES}" > "${RUNNER_TEMP}/release-notes.md"

      # --release-notes replaces the list of commits GoReleaser would generate;
      # release.footer in .goreleaser.yaml is still appended below it.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7.2.3
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The dockerhub entry in .goreleaser.yaml is gated on this variable
          # carrying something. The guard above leaves it empty when either
          # secret is missing, and GoReleaser's isEnvSet reads an empty value
          # as unset, so the entry disables itself and only ghcr.io is pushed.
          DOCKERHUB_USERNAME: ${{ steps.dockerhub.outputs.publish == 'true' && secrets.DOCKERHUB_USERNAME || '' }}

      # Pull what was just published and start it, once per architecture. A
      # multi-platform image is assembled from cross-compiled binaries that
      # nothing has ever executed: gitlab-mcp-server published an arm64 image
      # that could not exec at all, and the pipeline had no way to notice
      # because no variant was ever run. This also proves the tag, the
      # manifest and the stamped version agree, which is the whole point of
      # the preflight above.
      #
      # Before running anything, each image is held to its signature, the way
      # a user is told to check it but with the exact identity rather than the
      # regexp: this workflow at this tag, nothing else. Every image up to
      # 2.5.0 was published unsigned and nothing noticed; `cosign verify`
      # exits non-zero on "no signatures found", so that is now a failed
      # release and not a quiet one.
      #
      # `latest` moves here, last, and only onto an image that passed both.
      # It is what every documented `docker run` pulls, and GoReleaser used to
      # push it with the version tag, before the signing and before this
      # check, so a failure in either left it naming an image nobody had
      # verified. A create from a single source with no annotation of its own
      # copies the index byte for byte, so `latest` names the digest the
      # signature covers, which the loop checks rather than assumes. A
      # prerelease leaves it alone.
      - name: Verify and run the published images, then move latest
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          DOCKERHUB: ${{ steps.dockerhub.outputs.publish }}
        run: |
          set -euo pipefail
          images=("ghcr.io/jmrplens/ghchronicle:v${VERSION}")
          if [ "${DOCKERHUB}" = "true" ]; then
            images+=("docker.io/jmrplens/ghchronicle:v${VERSION}")
          fi
          identity="https://github.com/jmrplens/ghchronicle/.github/workflows/release.yml@refs/tags/v${VERSION}"
          for image in "${images[@]}"; do
            if ! cosign verify \
                --certificate-identity "${identity}" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                "${image}" > /dev/null; then
              echo "::error::${image} carries no valid signature by ${identity}. The release is published and latest was not moved; see RELEASING.md, When something goes wrong."
              exit 1
            fi
            echo "${image}: signed by ${identity}"
          done
          for platform in linux/amd64 linux/arm64; do
            out="$(docker run --rm --pull=always --platform "${platform}" \
              "ghcr.io/jmrplens/ghchronicle:v${VERSION}" -version)"
            echo "${platform}: ${out}"
            case "${out}" in
              "ghchronicle ${VERSION} "*) ;;
              *)
                echo "::error::the ${platform} image reports '${out}', expected version ${VERSION}. The release is published and latest was not moved."
                exit 1
                ;;
            esac
          done
          case "${VERSION}" in
            *-*)
              echo "${VERSION} is a prerelease, so latest stays where it was"
              exit 0
              ;;
          esac
          for image in "${images[@]}"; do
            repo="${image%:*}"
            docker buildx imagetools create --tag "${repo}:latest" "${image}"
            want="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${image}")"
            got="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${repo}:latest")"
            if [ -z "${want}" ] || [ "${want}" != "${got}" ]; then
              echo "::error::${repo}:latest names ${got:-nothing} and ${image} is ${want:-unreadable}, so the signature on the version tag does not cover latest."
              exit 1
            fi
            echo "${repo}:latest now names ${want}, the digest signed as ${image}"
          done

  # The moving major tag, which is the only thing that makes
  # `uses: jmrplens/ghchronicle@v2` follow a release. A `uses:` ref is an exact
  # git lookup and not a semver range: with no tag named `v2` a workflow fails
  # to resolve it, and with a stale one every Action user silently stays on the
  # previous release. Proven against this repository's own refs: `tags/v2` and
  # `tags/v2.1.0` resolve, `tags/v2.1` is a 404.
  #
  # Last, and only when the release actually published. Moving the pointer
  # before the archives exist would send every Action user at a release that
  # is not there. It was a manual step in RELEASING.md until 2026-09-19, and it
  # was forgotten for the length of one release: the tag is a rule that holds
  # where somebody remembered to apply it, which is the kind this repository
  # keeps turning into something checked.
  #
  # Pushing it starts nothing: the workflow's own filter is `v*.*.*`, and a tag
  # pushed with GITHUB_TOKEN does not trigger workflows anyway.
  major-tag:
    name: Major tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [preflight, goreleaser]
    permissions:
      contents: write # force-move the major tag
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Every tag, to read where the three-part one points.
          fetch-depth: 0
          # The one checkout in this workflow that keeps its credentials,
          # because this is the one step that pushes. The token it keeps is
          # the job's own, narrowed to contents: write above.
          persist-credentials: true

      - name: Move the major tag onto this release
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          major="v${VERSION%%.*}"
          # The commit and not the tag object: a tag pointing at a tag is not
          # what `@v2` should resolve through.
          commit="$(git rev-parse --verify --quiet "v${VERSION}^{}")"
          # --verify --quiet, because a bare rev-parse prints the string it
          # could not resolve to stdout and then fails: without it a major tag
          # that does not exist yet lands in the variable as the literal
          # "v3^{}" rather than as nothing.
          at="$(git rev-parse --verify --quiet "${major}^{}" || true)"
          if [ "${at}" = "${commit}" ]; then
            echo "${major} already points at ${commit}"
            exit 0
          fi
          # Annotated with a message, because a repository configured to sign
          # its tags makes every `git tag` annotated, and an annotated tag with
          # no message is an error rather than a prompt.
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -f -a "${major}" "${commit}" -m "${major}"
          git push -f origin "refs/tags/${major}"
          echo "::notice::${major} now points at ${commit} (v${VERSION})"

      # Listing a release in the Marketplace is the one step no token can take:
      # GitHub asks for a 2FA confirmation that only its web page performs, and
      # the releases API has no parameter for it. A release this workflow made
      # and nobody ticked stays out of the listing's version menu, so the run
      # ends by saying where the box is rather than trusting it to be recalled.
      - name: Point at the Marketplace box
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          edit="https://github.com/${REPO}/releases/edit/v${VERSION}"
          echo "::notice title=Marketplace::list v${VERSION} in the Marketplace: ${edit} (the box is ticked; Update release)"
          {
            echo "### List v${VERSION} in the Marketplace"
            echo
            echo "Open [the release's edit page](${edit}), leave **Publish this Action to the GitHub Marketplace** ticked and press **Update release**. No token can do this for the workflow."
          } >> "${GITHUB_STEP_SUMMARY}"
