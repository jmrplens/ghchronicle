# Dependabot configuration: ghchronicle
# Docs: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
#
# Every ecosystem states its own cooldown. GitHub has applied a three-day
# default since July 2026, but a default is a property of the platform, not of
# this repository: it can be changed, and an absent key would then mean
# something different without anything here changing. A week is long enough for
# a compromised release to be yanked (the September 2025 npm maintainer
# phishing that hit `debug`, `chalk` and 16 other packages was caught in
# hours), and security updates ignore cooldown entirely, so this delays
# convenience, not fixes.
#
# Two deliberate omissions:
#   * SemVer sub-keys are left off the docker entry: Dependabot scopes them to
#     SemVer-aware managers and rejects the whole configuration otherwise,
#     which would stop that ecosystem's updates completely.
#   * docker-compose has no entry. The only compose file is the containerized
#     end-to-end suite's (test/e2e/docker), whose pinned store releases are
#     that suite's subject, and the suite runs from e2e.yml (weekly, on demand
#     and as the release gate), never on a pull request. A Dependabot pull
#     request moving a store would pass CI without the store it moved ever
#     being started.

version: 2

updates:
  # Go modules (root go.mod). Not govulncheck: go.mod records a tool's module as
  # `// indirect`, version updates skip every indirect requirement, and
  # Dependabot reads no `tool` directive (dependabot/dependabot-core#12050), so
  # the scanner is bumped by hand (see scripts/govulncheck.sh).
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Madrid"
    cooldown:
      default-days: 7
      semver-minor-days: 14
      semver-major-days: 30
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "go"
    groups:
      go-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10

  # pnpm / Astro docs site (site/package.json)
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Madrid"
    cooldown:
      default-days: 7
      semver-minor-days: 14
      semver-major-days: 30
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Madrid"
    # No SemVer sub-keys: an action pin is a commit SHA with a version comment,
    # and the cooldown that matters is the flat one before a hijacked tag is
    # adopted.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions-all:
        applies-to: version-updates
        patterns:
          - "*"

  # Docker: the root Dockerfile, which builds the image from source, and
  # docker/Dockerfile.goreleaser, which the release builds the published images
  # from. Both pin their bases by digest, and the digest is what this bumps.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Madrid"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
