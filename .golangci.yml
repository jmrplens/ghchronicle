# golangci-lint v2 configuration for ghchronicle
# Run: golangci-lint run ./...
# Docs: https://golangci-lint.run/usage/configuration/
#
# The same linters with the same settings as github.com/jmrplens/gitlab-mcp-server,
# which is itself based on https://github.com/maratori/golangci-lint-config.
# The only values that differ are the ones that name a project: the module
# path, the build tag of the end to end suite, misspell's extra words and the
# G101 exclusion for action_specs.go, both of which exist for files only the
# reference has. A setting changed here should change there too, and the
# other way round, so the two repositories keep one standard rather than two.

version: "2"

issues:
  # Avoid truncating repeated issues (default: 3 is too low for initial lint runs).
  max-same-issues: 50

run:
  # The version go.mod declares, so modernize never suggests a construct the
  # module is not allowed to use yet.
  go: "1.27"
  timeout: 15m
  tests: true
  # golangci-lint defaults to one worker per logical CPU, and the working set of
  # every linter across every package grows with it. Four matches a CI runner,
  # so a local run behaves like the one that gates the merge.
  concurrency: 4
  # The containerized end to end suite lives behind this tag. Without it the
  # linters never see test/e2e/docker, which is the code that decides whether
  # every store answers the same dashboard.
  build-tags:
    - dockere2e

linters:
  default: none
  enable:
    # --- Bug Detection ---
    - govet # Official Go vet checks
    - staticcheck # Comprehensive static analysis (SA*, S*, ST*, QF*)
    - errcheck # Unchecked error return values
    - ineffassign # Detects ineffectual assignments
    - bodyclose # HTTP response body not closed. The collector issues thousands
      # of requests per sweep and every sink posts, so a leaked body is this
      # project's characteristic bug.
    - noctx # HTTP requests without context.Context. A request that cannot be
      # cancelled keeps a sweep alive after the run was told to stop.
    - durationcheck # Multiplying two time.Duration values. The config carries
      # cadences per group and per family, a backfill bound and a cooldown.
    - nilerr # Returns nil when err is not nil. In a collector that is how a
      # failed page becomes a family that silently reports nothing.
    - nilnesserr # Checks err != nil but returns a different nil error
    - nilnil # Returns nil,nil without reason
    - errname # Sentinel error naming conventions (ErrFoo)
    - errorlint # Finds code that breaks error wrapping (errors.Is/As). The
      # collectors decide whether a family is skippable by asking errors.As
      # about ghapi.UnavailableError and ghapi.NotReadyError.
    - fatcontext # Detects nested contexts in loops
    - reassign # Detects package variable reassignment

    # --- Security ---
    - gosec # OWASP-oriented security scanner (G1xx-G7xx). This binary reads a
      # token from the environment, writes state next to itself and posts to
      # every configured store.

    # --- Code Quality ---
    - gocyclo # Function cyclomatic complexity guard
    - gocognit # Cognitive complexity guard
    - nestif # Nested if complexity guard
    - maintidx # Maintainability index guard
    - dupl # Duplicate code guard. A collector copied from its neighbour and
      # left with the neighbour's Since check is a bug this catches as a smell.
    - revive # Configurable Go linter (golint replacement)
    - gocritic # ~100 diagnostics: bugs, performance, style
    - unconvert # Unnecessary type conversions
    - unparam # Unused function parameters
    - unused # Unused code (variables, functions, types)
    - wastedassign # Finds wasted assignment statements
    - predeclared # Detects shadowing of Go predeclared identifiers
    - recvcheck # Checks receiver type consistency (pointer vs value)
    - asciicheck # Checks for non-ASCII identifiers
    - nolintlint # Reports ill-formed or insufficient nolint directives
    - whitespace # Detects leading/trailing whitespace in functions

    # --- Style & Formatting ---
    - misspell # Spelling mistakes in comments and strings
    - usestdlibvars # Use stdlib constants instead of magic values
    - intrange # for i := 0; i < n; i++ → for i := range n (Go 1.22+)
    - modernize # Suggests simplifications using modern Go features
    - usetesting # Reports functions that should use testing.T helpers

    # --- Performance ---
    - perfsprint # fmt.Sprintf → strconv when possible. The line protocol
      # encoder formats every field of every point.

    # --- Bug Detection (drop-in safe) ---
    - bidichk # Dangerous bidi unicode (CVE-2021-42574 trojan source protection)
    - copyloopvar # Loop variable copies (Go 1.22+, copies not needed)
    - exptostd # Replace golang.org/x/exp with std equivalents
    - iotamixing # Mixed iota in const blocks
    - loggercheck # slog/log key-value pair validation
    - makezero # Slice append after non-zero-length make
    - mirror # bytes/strings mirror patterns (avoid unnecessary conversions)
    - nakedret # Naked returns in long functions
    - nosprintfhostport # Sprintf misuse for host:port URLs (RFC 3986 compliance)
    - testableexamples # Examples have expected output (Output: comments)

    # --- Style ---
    - goprintffuncname # Printf-like funcs end in 'f'
    - tparallel # t.Parallel() correctness
    - thelper # Test helpers must call t.Helper()

    # --- Bug Detection (require care) ---
    - contextcheck # Context propagation. The sweep scheduler's cancellation
      # reaches only as far as the context is actually passed.
    - errchkjson # json.Marshal/Encode error handling
    # --- Linters intentionally NOT enabled (false positives) ---
    # - dupword: false positives on godoc auto-generated comments split from CamelCase
    #   identifiers. Auto-fix removes letters that are part of the identifier.
    # - gocheckcompilerdirectives: false positive on //go:fix inline (valid Go 1.24+
    #   directive used by gopls/go fix tooling, not yet recognized by the linter).

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment # Too noisy for this project
      settings:
        shadow:
          strict: true

    staticcheck:
      checks:
        - "all"

    errcheck:
      check-type-assertions: true
      check-blank: false

    gosec:
      excludes:
        - G104 # Unhandled errors (covered by errcheck)
      config:
        global:
          audit: "true"

    revive:
      severity: error
      enable-all-rules: false
      enable-default-rules: true
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          arguments:
            - "checkPublicInterface"
        - name: increment-decrement
        - name: indent-error-flow
        - name: var-naming
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: struct-tag
        - name: unused-parameter
        - name: unnecessary-stmt

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
        - opinionated
        - experimental
      disabled-checks:
        - hugeParam # Too strict for tool input/output structs
        - rangeValCopy # Often false positives with simple structs

    misspell:
      locale: US
      # No extra-words. The reference lists spellings an external API sends
      # and quotations it must not alter; nothing in this tree compares
      # against such a string, so every British spelling here is prose and
      # takes the US form.

    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

    usetesting:
      context-background: false # Too noisy across existing tests
      context-todo: true
      os-chdir: true
      os-mkdir-temp: true
      os-setenv: true
      os-temp-dir: true

    gocyclo:
      min-complexity: 20

    gocognit:
      min-complexity: 25

    nestif:
      min-complexity: 5

    maintidx:
      under: 20

    dupl:
      threshold: 150

    perfsprint:
      integer-format: true
      int-conversion: true
      err-error: true
      errorf: true
      sprintf1: true
      strconcat: true

  exclusions:
    # Keep focused package runs warning-free when exclusions for unrelated
    # packages are not exercised by the selected target.
    warn-unused: false
    # Keep upstream presets that suppress generated comment noise, unchecked
    # standard-library writes/closes, and common test fixture false positives.
    presets:
      - comments
      - std-error-handling
      - common-false-positives

    # Custom exclusions
    rules:
      # Test files: relax some rules
      - path: "_test\\.go"
        linters:
          - errcheck
          - gocritic
          - revive
          - unparam
          - dupl

      # Test fixtures intentionally use fake tokens, passwords, and keys.
      - path: "_test\\.go"
        linters:
          - gosec
        text: "G101: Potential hardcoded credentials"

      # The end to end suites share one fake GitHub and, in the containerized
      # suite, one set of stores across subtests, so they run sequentially.
      # Disable only the t.Parallel() requirement for them.
      - path: "test/e2e/"
        linters:
          - tparallel

output:
  formats:
    text:
      path: stdout
  sort-order:
    - linter
    - severity
    - file
  show-stats: false

formatters:
  enable:
    - goimports # Import grouping and ordering
    - gofumpt # Stricter gofmt-compatible formatting
    - gci # Enforce deterministic import section grouping
  settings:
    gofumpt:
      module-path: github.com/jmrplens/ghchronicle/v2
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/jmrplens/ghchronicle/v2)
      custom-order: true
    goimports:
      local-prefixes:
        - github.com/jmrplens/ghchronicle/v2
