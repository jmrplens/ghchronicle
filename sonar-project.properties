# SonarCloud Configuration for ghchronicle
# This file configures rule exclusions for Go-specific patterns that SonarCloud
# flags incorrectly or too aggressively.

sonar.projectKey=jmrplens_ghchronicle
sonar.organization=jmrplens
sonar.projectName=ghchronicle

# Source and test directories
#
# version.go is named on its own because it is the module's root package and
# there is no other Go file beside it: it embeds the VERSION file, which a
# go:embed directive can only reach from a package in the same directory, and
# it parses what it embeds. Without it here the one package that decides what
# every build calls itself would be the one package Sonar never reads. If that
# file is ever removed, remove it from this line too: the scanner fails on a
# source path that does not exist.
sonar.sources=version.go,cmd,internal
sonar.tests=cmd,internal
sonar.test.inclusions=**/*_test.go

# Coverage report (generated by CI)
sonar.go.coverage.reportPaths=coverage.out

# Almost nothing is excluded from coverage. The profile CI uploads already
# spans both roots (`go test -coverpkg=./cmd/...,./internal/...`), so the number
# Sonar reports is the number for the whole repository, `cmd/` development
# utilities included. The single exception, Windows-only source, is argued at
# the end of this block.
#
# This used to exclude cmd/probe, cmd/gen_*, cmd/check_* and
# cmd/publish_dashboard on the grounds that their worth is in the artifacts
# they produce and in the check targets that compare those artifacts byte for
# byte, not in a coverage number. That reasoning made the headline coverage
# figure describe the collector while appearing to describe the project, and
# it removed any pressure to test the tooling the dashboards and the brand
# assets are built with. They are tested now, each against a stand-in for
# what it talks to: a fake Grafana, a fake GitHub, a stand-in for psql and one
# for rsvg-convert.
#
# The one exception is Windows-only source. `coverage.out` is produced by a
# `go test` run on Linux, where a file behind `//go:build windows` is not
# compiled at all, so it contributes no statements and Sonar reads the absence
# as zero coverage. That is a measurement artifact, not an untested file: the
# one such file today, internal/sink/rename_windows.go, is run by the sink's
# own tests on the Windows leg of the cross-platform matrix, whose profile is
# not the one Sonar reads.
#
# This is a coverage exclusion rather than an analysis one, so the files are
# still linted for bugs and smells; only the coverage denominator ignores them.
# The alternative worth building later is collecting a profile from a Windows
# run and merging it, which would measure them properly instead of excusing
# them. Until that exists, excluding is the honest reading and counting them is
# not.
sonar.coverage.exclusions=**/*_windows.go

# Exclude non-code files that SonarQube cannot parse (e.g. VERSION triggers
# the C/C++ analyzer with "Expected unqualified-id").
#
# testdata is excluded for the reason the Go toolchain excludes it: it holds
# fixtures, not program code. cmd/check_postgres/testdata/sudo and
# cmd/gen_brand/testdata/rsvg-convert are programs a test builds and runs as a
# stand-in process, so they are never linked into a test binary and can never
# be covered by one.
sonar.exclusions=VERSION,**/testdata/**

# No copy-paste exclusions. The eleven sinks and the per-family collectors are
# parallel by construction and may well be flagged, but a reason written before
# the first finding is a guess. Write one when SonarCloud actually reports
# something.

# =============================================================================
# Rule Exclusions for Test Files
# =============================================================================
# These rules are suppressed in test files because they conflict with idiomatic
# Go test patterns.

# S1192: "Define a constant instead of duplicating this literal"
# In Go test files, table-driven tests and httptest mocks deliberately repeat
# string literals (API paths, URLs, error messages, test data) for readability.
# Extracting every repeated literal into a constant harms test clarity without
# meaningful quality improvement.
#
# S1186: "Add a nested comment explaining why this function is empty"
# Empty function bodies in httptest handler mocks are intentional: they simulate
# HTTP 200 OK responses. This is standard Go httptest practice:
#   http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {})
#
# S100: "Rename function to match the regular expression"
# Go test names use underscores by convention (TestFoo_Bar_Baz). This is the
# standard Go testing pattern documented at https://go.dev/doc/code#Testing.
# SonarQube's regex ^(_|[a-zA-Z0-9]+)$ does not accommodate Go conventions.
#
# S3776: "Refactor this method to reduce its Cognitive Complexity"
# Test helper functions that verify multiple fields of API responses naturally
# have higher complexity. Splitting them reduces test readability.
sonar.issue.ignore.multicriteria=t1,t2,t3,t4,g1,g2

# S1192: duplicated string literals in tests
sonar.issue.ignore.multicriteria.t1.ruleKey=go:S1192
sonar.issue.ignore.multicriteria.t1.resourceKey=**/*_test.go

# S1186: empty function body in tests (httptest mocks)
sonar.issue.ignore.multicriteria.t2.ruleKey=go:S1186
sonar.issue.ignore.multicriteria.t2.resourceKey=**/*_test.go

# S100: function naming (Go test names use underscores)
sonar.issue.ignore.multicriteria.t3.ruleKey=go:S100
sonar.issue.ignore.multicriteria.t3.resourceKey=**/*_test.go

# S3776: cognitive complexity in test helpers
sonar.issue.ignore.multicriteria.t4.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.t4.resourceKey=**/*_test.go

# =============================================================================
# Rule Exclusions: Global (all Go files)
# =============================================================================

# S1135: "Complete the task associated to this TODO comment"
# TODO and FIXME annotations are standard practice in all codebases including
# Go's own standard library. They serve as tracking mechanisms, not quality
# issues.
sonar.issue.ignore.multicriteria.g1.ruleKey=go:S1135
sonar.issue.ignore.multicriteria.g1.resourceKey=**/*.go

# S3776: "Refactor this method to reduce its Cognitive Complexity"
# Go option-builder functions that map input struct fields to API option structs
# use many `if field != zero { opts.Field = value }` branches. Each branch is a
# trivial null-check + assignment, but the sum exceeds the threshold of 15.
# This is idiomatic Go for configuration/options building (see Go stdlib
# http.Server, tls.Config, etc.). Refactoring into sub-functions harms
# readability without improving maintainability.
#
# Cognitive complexity is still gated, by golangci-lint's gocognit at 25 in
# .golangci.yml, which fails the lint job rather than filing an issue.
sonar.issue.ignore.multicriteria.g2.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.g2.resourceKey=**/*.go
