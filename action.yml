name: ghchronicle
description: Collect GitHub metrics for an account and, optionally, render a profile card SVG.
author: jmrplens
# The Marketplace listing draws these two, and they are the only picture it
# will take: an Action's tile is a Feather icon in one of nine colours, never
# an image the repository supplies. `grid` is the closest shape in that set to
# the mark, which is a grid of squares, and green is the mark's own colour.
branding:
  icon: grid
  color: green

inputs:
  token:
    description: >
      A personal access token. The automatic GITHUB_TOKEN is not enough for most
      of what this collects: traffic needs push access to every repository and
      Dependabot alerts need the security_events scope.
    required: true
  config:
    description: Path to a ghchronicle configuration file. Omit to run with defaults built from `user`.
    required: false
    default: ""
  user:
    description: The account to collect when no config file is given.
    required: false
    default: ${{ github.repository_owner }}
  mode:
    description: "`once` for one sweep, `backfill` to reach as far back as GitHub allows, `card` to only render the SVG."
    required: false
    default: once
  backfill-since:
    description: Bound for `backfill` mode. A date (2024-01-01), days (90d), years (2y) or a duration (720h). Empty means no bound.
    required: false
    default: ""
  card:
    description: Path of the SVG to write. Empty means no card. Its directory is created if it does not exist.
    required: false
    default: ""
  card-layout:
    description: One of the registered layouts (summary, github-stats, github-compact, badge-row, wide-banner, sparkline-hero, language-ring, repo-list, activity-heatmap, animated-counters, terminal, ticker, language-bars).
    required: false
    default: summary
  card-theme:
    description: dark, light, auto, or both to write the light card at `card` and the dark one beside it with _dark before the extension.
    required: false
    default: auto
  card-fields:
    description: Comma-separated field identifiers to show. Empty means the layout's default.
    required: false
    default: ""
  card-motion:
    description: How an animated layout moves. `once` plays and settles, `loop` does the same and lets whatever the layout has that never ends go on for ever (only `terminal` and `ticker` have one), `off` draws the finished card with no animation.
    required: false
    default: once
  card-width:
    description: >
      Card width in pixels. Empty, or 0, draws the layout at its own width. Each layout draws between
      its own minimum and 1200 and refuses anything outside that; `badge-row` ignores it, its width
      following its pills. Only `activity-heatmap` spends the room on data, a week of the contribution
      calendar at a time and the whole year at about 900; every other layout spreads the same content
      wider.
    required: false
    default: ""
  include-private:
    description: >
      `true` counts private repositories in the card, when no config file is given.
      Off by default because a layout that lists repositories would publish their names.
    required: false
    default: "false"
  version:
    description: The ghchronicle release to install. `latest` resolves the newest tag.
    required: false
    default: latest

runs:
  using: composite
  steps:
    - name: Install ghchronicle
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        # A release binary rather than `go install`, so the Action needs no Go
        # toolchain on the runner and starts in seconds.
        if [ "$VERSION" = "latest" ]; then
          # The newest release whose tag names a version in three parts, which
          # is not the question `releases/latest` answers: that one reports
          # whichever release carries GitHub's own "latest" flag, and
          # publishing this Action to the Marketplace creates a second release
          # for the moving major tag. That release holds no binaries and took
          # the flag by date, so the download below asked for
          # ghchronicle_1_linux_amd64.tar.gz and every run of this Action
          # failed on its first step. grep rather than sed because the list
          # arrives as one line and a greedy expression would read the last
          # tag on it rather than the first.
          VERSION=$(curl -fsSL "https://api.github.com/repos/jmrplens/ghchronicle/releases?per_page=100" \
            | grep -o '"tag_name": *"v[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*"' \
            | sed 's/.*"\(v[^"]*\)"$/\1/' | head -1)
          if [ -z "$VERSION" ]; then
            echo "no ghchronicle release with a three part tag was found" >&2
            exit 1
          fi
        fi
        os=$(uname -s | tr '[:upper:]' '[:lower:]')
        arch=$(uname -m); case "$arch" in x86_64) arch=amd64;; aarch64|arm64) arch=arm64;; esac
        curl -fsSL "https://github.com/jmrplens/ghchronicle/releases/download/${VERSION}/ghchronicle_${VERSION#v}_${os}_${arch}.tar.gz" | tar -xz -C "$RUNNER_TEMP" ghchronicle
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

    - name: Write a default configuration
      if: inputs.config == ''
      shell: bash
      env:
        USER_LOGIN: ${{ inputs.user }}
        INCLUDE_PRIVATE: ${{ inputs.include-private }}
        OUT: ${{ runner.temp }}/ghchronicle.yaml
      run: |
        set -euo pipefail
        # A state directory of its own for every use of the Action in a job.
        # runner.temp outlives the step, so one fixed path would hand the
        # second use of the Action the state the first one left behind, and a
        # `once` step would then skip every family that one had marked as run.
        # A `card` step draws the same card either way: a card run collects
        # every family whatever the state file says, and `card-only` writes
        # nothing back to it.
        STATE="$(mktemp -d "$RUNNER_TEMP/ghchronicle.XXXXXX")/state.json"
        export STATE
        bash "$GITHUB_ACTION_PATH/scripts/action-config.sh"
        echo "GHC_CONFIG=$OUT" >> "$GITHUB_ENV"

    - name: Use the given configuration
      if: inputs.config != ''
      shell: bash
      # Through the environment like every other input here, rather than
      # interpolated into the script. A `${{ }}` inside a `run:` is expanded
      # before bash sees the line, so the value becomes part of the command
      # rather than an argument to it, and a caller who passes this input from
      # something a stranger wrote is handing that stranger the runner.
      env:
        CONFIG: ${{ inputs.config }}
      run: |
        set -euo pipefail
        # One line, and the name of a file: a value carrying a newline would
        # otherwise write a second variable of its own into the environment
        # every later step reads.
        case $CONFIG in
          *[$'\n\r']*) echo "config must be one path, with no line break" >&2; exit 2 ;;
        esac
        echo "GHC_CONFIG=$CONFIG" >> "$GITHUB_ENV"

    - name: Run
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        MODE: ${{ inputs.mode }}
        SINCE: ${{ inputs.backfill-since }}
        CARD: ${{ inputs.card }}
        LAYOUT: ${{ inputs.card-layout }}
        THEME: ${{ inputs.card-theme }}
        FIELDS: ${{ inputs.card-fields }}
        MOTION: ${{ inputs.card-motion }}
        WIDTH: ${{ inputs.card-width }}
      run: bash "$GITHUB_ACTION_PATH/scripts/action-run.sh"
