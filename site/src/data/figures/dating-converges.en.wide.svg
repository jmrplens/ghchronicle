<svg xmlns="http://www.w3.org/2000/svg" class="gf" viewBox="-1 -1 722 275"
 role="img" aria-labelledby="gf-dating-en-wide-t gf-dating-en-wide-d">
<title id="gf-dating-en-wide-t">Two ways of writing the same fourteen days</title>
<desc id="gf-dating-en-wide-d">Two ways of writing GitHub's 14-day traffic window, side by side. On the left, dating as built: 4 sweeps a day, 6 hours apart, each re-read the whole window and stamp every day at that day's own date, so all 4 land on the same 14 rows and the newest count replaces the one before it. After a week the store holds 14 rows per repository. On the right, the same sweeps stamped at the moment of collection: each one adds 14 rows instead of replacing 14, so after a week the store holds 392 rows per repository, 28 copies of every day, and a sum over them reports 28 times the traffic.</desc>
<style>.gf{font-family:var(--sl-font,ui-sans-serif,system-ui,sans-serif)}.gf text{fill:var(--rb-body,#c3ccd2);font-size:12.5px}.gf .gf-title{fill:var(--rb-heading,#f2f6f8);font-size:14.5px;font-weight:600}.gf .gf-col{fill:var(--rb-heading,#f2f6f8);font-size:12px;font-weight:600}.gf .gf-muted{fill:var(--rb-muted,#8b969d);font-size:11px}.gf .gf-small{font-size:11px}.gf .gf-count{font-size:26px;font-weight:700}.gf .gf-keep{fill:var(--rb-accent,#3fb950)}.gf .gf-add{fill:var(--rb-status-drop,#e0605c)}.gf .gf-box{fill:var(--rb-surface,#151c20);stroke:var(--rb-border,#2a333a);stroke-width:1}.gf .gf-cell-keep{fill:var(--rb-accent-soft,#0d2115);stroke:var(--rb-accent,#3fb950);stroke-width:1}.gf .gf-cell-add{fill:var(--rb-status-drop-soft,#2b1618);stroke:var(--rb-status-drop,#e0605c);stroke-width:1}.gf .gf-bar{fill:var(--rb-accent-soft,#0d2115)}.gf .gf-edge{fill:var(--rb-accent,#3fb950)}.gf .gf-rule{stroke:var(--rb-border,#2a333a);stroke-width:1}.gf .gf-line{stroke:var(--rb-muted,#8b969d);stroke-width:1;fill:none}.gf .gf-head{fill:var(--rb-muted,#8b969d)}</style>
