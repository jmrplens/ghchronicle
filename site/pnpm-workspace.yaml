packages:
  - .

overrides:
  # TypeScript stays on 6.x. The 7.0 compiler is the native one and does not
  # expose the programmatic API `astro check` is built on, so `pnpm run lint`
  # stops at "does not expose the programmatic API" the moment 7 is installed.
  # Astro tracks it at withastro/roadmap#1321; lift this when that closes.
  typescript: 6.0.3
  lodash: 4.18.1
  # One yaml across the tree, at the release package.json names. It came with a
  # selector for yaml-language-server 1.20.0 (under @astrojs/check), whose yaml
  # 2.7.1 is inside GHSA-48c2-rrv3-qjmp (< 2.8.3); the tree now has 1.23.0,
  # which asks for 2.8.3, so that selector matched nothing and is gone. Move
  # this line with the yaml entry in package.json: left at 2.9.0 while
  # package.json said 2.9.1, it held the lockfile on 2.9.0, so Dependabot's
  # update of yaml changed no file and failed its run with NoChangeError.
  yaml: 2.9.1
  # brace-expansion ReDoS (GHSA-3jxr-9vmj-r5cp), unbounded-expansion DoS
  # (GHSA-mh99-v99m-4gvg, GHSA-rgw5-rvv9-x895), and the three DoS advisories of
  # 2026-09-30 (GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7, GHSA-q2hr-2g5m-vwhr,
  # fixed in 1.1.21 and 5.0.12); dev/build deps only. The 1.x line has fixed
  # releases on its 1.x tag, so both branches can be pinned to a patched
  # version and neither needs an audit exception. Do not force 5.x onto a 1.x
  # consumer: v1 exported the expand function directly where v5 exports an
  # object.
  "brace-expansion@<1.1.21": 1.1.21
  "brace-expansion@>=3.0.0 <5.0.12": 5.0.12
  # js-yaml quadratic CPU consumption in !!omap resolution (GHSA-5p4m-2wfm-xmqj,
  # CVE-2026-59870), and then maxTotalMergeKeys not bounding CPU for empty
  # merge sources (GHSA-2883-xcg3-v3hh), which 4.3.1 is itself vulnerable to.
  # Build deps only (@astrojs/internal-helpers and friends). 4.3.2 is the
  # v4-legacy tag: the 4.x line is what Astro depends on, and pinning 5.x onto
  # it is a major bump an advisory fix should not drag in.
  "js-yaml@>=4.0.0 <4.3.2": 4.3.2
  # 7.3.1 added a pass that moves a <style> element's text into a `set:html`
  # property, and runs it before the pass that collapses static MDX subtrees
  # to an HTML string. Starlight turns that collapsing on, so the property is
  # serialized as a literal attribute: Expressive Code's stylesheet shipped as
  # `<style set:html="...">` on every page with a code block, and every code
  # block lost its frame, its colors and its copy button. 7.3.0 predates the
  # new pass and has no such bug. Lift this pin once a release fixes the order
  # and scripts/check-directives.mjs passes on its build. 7.3.4 (2026-10-21)
  # with astro 7.4.2 still fails it, on 66 pages. package.json names 7.3.0
  # exactly too, so the manifest says what is installed, and
  # .github/dependabot.yml ignores the package while this pin stands: an
  # update there rewrites package.json and this line keeps the lockfile on
  # 7.3.0, so the pull request would move nothing but the manifest.
  "@astrojs/markdown-remark": 7.3.0

peerDependencyRules:
  allowedVersions:
    typescript: ">=6.0.0"

allowBuilds:
  esbuild: true
  puppeteer: true
  sharp: true

# Disable the supply-chain release-age gate so dependencies always resolve to
# the latest published versions (pnpm 11.8 applies a non-zero default otherwise).
minimumReleaseAge: 0
