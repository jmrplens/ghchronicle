# Telegraf for the sink that posts line protocol to http_listener_v2.
#
# The output is a file rather than another store: the point of the Telegraf
# sink is that Telegraf keeps the timestamps it is given and routes them
# onward, and a file is the one output that lets a test read back exactly what
# arrived, in the format it arrived in.
[agent]
	interval = "1s"
	flush_interval = "1s"
	round_interval = false
	omit_hostname = true
	# A sweep arrives as one large POST. Anything smaller than the whole of it
	# here would drop points on the floor and blame the sink.
	metric_batch_size = 50000
	metric_buffer_limit = 200000

[[inputs.http_listener_v2]]
	service_address = ":8186"
	paths = ["/telegraf"]
	methods = ["POST"]
	data_format = "influx"
	# A sweep's line protocol is larger than the 500 MB default is small, but
	# the default 500 MB is also larger than this container's memory: bound it.
	max_body_size = "64MB"

[[outputs.file]]
	files = ["/out/telegraf.influx"]
	data_format = "influx"
	influx_sort_fields = true
