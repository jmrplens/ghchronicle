# Retention for the metrics the Graphite sink writes.
#
# The image's default catch-all is 10s:6h,1m:6d,10m:1800d, which is 270,000
# points in every whisper file, and one sweep creates hundreds of files. This
# one keeps two archives instead: an hour of resolution for four months,
# then a day of resolution for twelve years.
#
# Four months rather than one because a panel can pin its own range: the
# Code panels ask for ninety days whatever the dashboard says, since
# gh_commit is too large to read further back. Graphite picks the archive
# that covers the whole request, so under an hourly archive of thirty days
# a ninety day request fell through to the daily one, which a two-point
# fixture never fills past whisper's xFilesFactor, and two panels that
# render perfectly came back empty. The hourly archive has to reach past
# the longest range any panel pins.
#
# Twelve years is not decoration, and it is not generous either. The points
# this tool writes carry the date the thing happened, and carbon drops, in
# silence, any point older than the longest archive: it accepts the line, finds
# no archive covering it and discards it. Measured here, a point from 2020
# vanished under a six year retention and the render API answered []. An
# account's first star is as old as the account.
[carbon]
pattern = ^carbon\.
retentions = 60s:1d

[ghchronicle]
pattern = .*
retentions = 1h:120d,1d:12y
