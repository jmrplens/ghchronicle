# Loki for the event lines.
#
# Two limits are deliberately not Loki's defaults, and the difference is the
# whole reason this file exists. Loki refuses an entry older than
# reject_old_samples_max_age, a week, and refuses one more than its
# out-of-order window behind the newest entry already in that stream, about
# two hours. Half of what this tool collects is older than both on purpose: a
# star from 2020, a pull request from 2024.
#
# In production the sink's own max_age is what keeps inside those windows, and
# test/e2e already proves it applies that horizon three ways. Here the windows
# are opened instead, so that a test asserting "the store kept the date of the
# event" is answered by the store rather than by a rejection.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ingester:
  # The out-of-order window is half of this, so a month back is accepted.
  max_chunk_age: 720h
  # A query for an entry dated 2020 never reaches the ingester: Loki 3.7 asks
  # the ingesters only about the recent past, and has no knob left to widen
  # that. So the chunk has to reach the store, and these three are how fast it
  # gets there. Measured: pushed, accepted with a 204, and invisible to every
  # query until it was flushed.
  chunk_idle_period: 5s
  flush_check_period: 2s
  flush_op_timeout: 30s
  # A consequence a test has to know: an entry is not queryable the instant the
  # push is answered. It becomes queryable once its chunk has been flushed,
  # which with the periods above is seconds rather than the default minutes, so
  # read it back by polling rather than by asking once.

limits_config:
  reject_old_samples: false
  reject_old_samples_max_age: 87600h
  max_query_lookback: 0s
  # A query that has to reach back to a 2020 star is longer than the 721h
  # default allows, and Loki refuses it rather than truncating it.
  max_query_length: 0s
  allow_structured_metadata: true
  volume_enabled: true
  ingestion_rate_mb: 64
  ingestion_burst_size_mb: 128
  per_stream_rate_limit: 64MB
  per_stream_rate_limit_burst: 128MB

analytics:
  reporting_enabled: false
