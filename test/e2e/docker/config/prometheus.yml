# Prometheus for the exporter sink.
#
# The exporter runs inside the collector process, on the host, on a port the
# test picks at run time, so the target cannot be written here. It arrives
# through file_sd: the harness writes ../out/prometheus-targets/ghchronicle.json
# once the exporter is listening, and Prometheus picks it up within
# refresh_interval without a reload.
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ghchronicle
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.json
        refresh_interval: 5s
