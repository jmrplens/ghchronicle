# carbon-cache for the Graphite sink, overriding three defaults that would
# each turn a real write into a silent loss.
#
# MAX_CREATES_PER_MINUTE is 50 by default. One sweep introduces hundreds of
# new metric paths at once, and everything past the fiftieth in a minute is
# dropped, not queued, so an assertion about a path would fail for a reason
# that has nothing to do with the sink.
#
# WHISPER_SPARSE_CREATE keeps each new file's blocks unallocated until they
# are written. With the retentions in storage-schemas.conf that is the
# difference between a few kilobytes per metric and the full file.
#
# ENABLE_TAGS is off because none of the paths this sink writes carry a tag,
# and with it on carbon posts to the tag database for every metric it sees.
#
# Everything else is carbon's own default; unset settings are not missing,
# they are inherited.
[cache]
DATABASE = whisper
ENABLE_LOGROTATION = True
USER =
MAX_CACHE_SIZE = inf
MAX_UPDATES_PER_SECOND = inf
MAX_CREATES_PER_MINUTE = inf
MIN_TIMESTAMP_RESOLUTION = 1
LINE_RECEIVER_INTERFACE = 0.0.0.0
LINE_RECEIVER_PORT = 2003
ENABLE_UDP_LISTENER = False
PICKLE_RECEIVER_INTERFACE = 0.0.0.0
PICKLE_RECEIVER_PORT = 2004
CACHE_QUERY_INTERFACE = 0.0.0.0
CACHE_QUERY_PORT = 7002
USE_INSECURE_UNPICKLER = False
USE_FLOW_CONTROL = True
LOG_UPDATES = False
LOG_CREATES = False
LOG_CACHE_HITS = False
LOG_CACHE_QUEUE_SORTS = False
CACHE_WRITE_STRATEGY = sorted
WHISPER_AUTOFLUSH = False
WHISPER_SPARSE_CREATE = True
WHISPER_FALLOCATE_CREATE = False
CARBON_METRIC_INTERVAL = 60
ENABLE_TAGS = False
GRAPHITE_URL = http://127.0.0.1:8080

# The image also runs carbon-aggregator, unconditionally, and this file
# replaces the image's own carbon.conf rather than adding to it. Without a
# section of its own the aggregator falls back to carbon's built-in defaults,
# which are LINE_RECEIVER_PORT = 2003, the port carbon-cache is configured for
# above, and DESTINATIONS = (), nothing. Measured here before this section
# existed: the aggregator won the race for 2003, logged every line it received
# as "Couldn't match metric ... with any aggregation rule. Passing on
# un-aggregated", had nowhere to pass it on to, and dropped the whole sweep.
# Carbon answered every write, the render API answered [], and no whisper file
# was ever created.
#
# So the aggregator is put back where the image had it, on 2023, forwarding to
# carbon-cache's pickle port, which leaves 2003 to the cache alone. Nothing
# sends it anything; it is here to not be in the way.
[aggregator]
LINE_RECEIVER_INTERFACE = 0.0.0.0
LINE_RECEIVER_PORT = 2023
PICKLE_RECEIVER_INTERFACE = 0.0.0.0
PICKLE_RECEIVER_PORT = 2024
DESTINATIONS = 127.0.0.1:2004
FORWARD_ALL = True
MAX_QUEUE_SIZE = 10000
